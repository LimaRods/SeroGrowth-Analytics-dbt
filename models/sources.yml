version: 2

sources:
  - name: internal
    database: solstice_raw
    schema: internal
    config: 
      freshness: # default freshness
        warn_after: {count: 2, period: hour}
        error_after: {count: 24, period: hour}
      loaded_at_field: "convert_timezone('UTC', ingested_at)" 

    tables:
      - name: usx_mint_redeem
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: type
            data_tests:
              - not_null
              - accepted_values:
                  values: ['CONFIRM_MINT', 'CONFIRM_REDEEM']

      - name: usx_vault
        columns:
          - name: id
            data_tests:
              - unique
              - not_null

      - name:  yield_vault
        columns:
          - name: id
            data_tests:
              - unique
              - not_null

      - name: usx_yield_transfer
        columns:
          - name: id
            data_tests:
              - unique
              - not_null

      - name: token_mint_burn
        columns:
          - name: id
            data_tests:
              - unique
              - not_null 


      - name: token_balances
        columns:
          - name: id
            data_tests:
              - unique
              - not_null

      - name: liquidity_clmm
        columns:
          - name: id
            data_tests:
              - unique
              - not_null

      - name: quest_completions
        columns:
          - name: id
            data_tests:
            - unique
            - not_null

      - name: quests
        columns:
          - name: id
            data_tests:
            - unique
            - not_null

      - name: users
        columns:
          - name: id
            data_tests:
            - unique
            - not_null

      - name: user_addresses
        columns:
          - name: id
            data_tests:
            - unique
            - not_null

      - name: exponent_liquidity_positions
        columns:
          - name: id
            data_tests:
            - unique
            - not_null 

      - name: pending_referral_rewards
        columns:
          - name: id
            data_tests:
            - unique
            - not_null

      - name: exponent_messages
        columns:
          - name: id
            data_tests:
            - unique
            - not_null

      - name: quest_blacklist
        freshness:
          warn_after: null
          error_after: null

      - name: exponent_points
        columns:
          - name: id
            data_tests:
              - unique
              - not_null

          


        

        
        
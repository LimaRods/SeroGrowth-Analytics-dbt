version: 2

models:

  - name: stg_x_weekly
    description: |
      X Ads weekly facts joined with campaign + client dims and FX rates.
      Grain: (campaign_id, ad_group_id, week_date) — same as PAID_MEDIA_DB.DEV.fct_x_weekly.
    columns:
      - name: id
        description: Surrogate PK passed through from fct_x_weekly.
        data_tests:
          - unique
          - not_null
      - name: campaign_id
        description: FK to campaigns_x. Tested for referential integrity.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('paid_media', 'campaigns_x')
                field: campaign_id
      - name: ad_group_id
        data_tests:
          - not_null
      - name: week_date
        data_tests:
          - not_null
      - name: spend_native
        data_tests:
          - not_null
      - name: ad_group_status
        description: Delivery status from the export.
      - name: data_quality_flag
        data_tests:
          - accepted_values:
              arguments:
                values: [partial_data, anomalous_metric, late_arriving, manual_review, missing_fx_rate]
              config:
                where: data_quality_flag is not null


  - name: stg_linkedin_daily
    description: |
      LinkedIn Ads daily facts at ad-set grain, joined with campaign + client dims and FX rates.
      Grain: (campaign_id, ad_set_id, day_date) — same as PAID_MEDIA_DB.DEV.fct_linkedin_daily.
    columns:
      - name: id
        data_tests:
          - unique
          - not_null
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('paid_media', 'campaigns_linkedin')
                field: campaign_id
      - name: ad_set_id
        data_tests:
          - not_null
      - name: day_date
        data_tests:
          - not_null
      - name: spend_native
        data_tests:
          - not_null
      - name: ad_set_daily_budget
        description: Ad-set 'Daily Budget' from the export. Surfaced (MAX per ad set) in dim_budget as daily_linkedin_budget; not in the metric marts.
      - name: ad_set_cost_type
        description: LinkedIn cost type. Nullable when the export doesn't expose it.
      - name: data_quality_flag
        data_tests:
          - accepted_values:
              arguments:
                values: [partial_data, anomalous_metric, late_arriving, manual_review, missing_fx_rate]
              config:
                where: data_quality_flag is not null


  - name: stg_google_weekly
    description: |
      Google Ads weekly facts joined with campaign + client dims and FX rates.
      Grain: (campaign_id, week_date) — same as PAID_MEDIA_DB.DEV.fct_google_weekly.
    columns:
      - name: id
        data_tests:
          - unique
          - not_null
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('paid_media', 'campaigns_google')
                field: campaign_id
      - name: week_date
        data_tests:
          - not_null
      - name: spend_native
        data_tests:
          - not_null
      - name: campaign_type
        description: Per-row Google campaign type. Determines intent vs engagement click semantics in int_paid_media_weekly.
        #data_tests:
         # - accepted_values:
           #   arguments:
             #   values: ['Search', 'Demand Gen', 'Performance Max', 'Display', 'Video']
              #config:
                #where: campaign_type is not null
      - name: data_quality_flag
        data_tests:
          - accepted_values:
              arguments:
                values: [partial_data, anomalous_metric, late_arriving, manual_review, missing_fx_rate]
              config:
                where: data_quality_flag is not null


  - name: stg_ga4_weekly
    description: |
      GA4 weekly attribution keyed by the UTM grain (matches the paid channels'
      utm_campaign / utm_content). Combines the Traffic + User Acquisition exports.
      Grain: (client_id, week_date, utm_source_medium, utm_campaign, utm_content).
    columns:
      - name: id
        data_tests:
          - unique
          - not_null
      - name: client_id
        data_tests:
          - not_null
      - name: week_date
        data_tests:
          - not_null
